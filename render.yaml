# Deploy this repo as a Render Blueprint (New + Blueprint).
# After the first deploy:
#   1. Copy the service URL (https://<name>.onrender.com)
#   2. Set SHOPIFY_APP_URL to that URL in the Render dashboard
#   3. Locally: npm run set-app-url -- https://<name>.onrender.com
#   4. Locally: shopify app deploy
#
# Sessions use SQLite unless DATABASE_URL is a Postgres URL.
# Free web services sleep after 15 minutes idle; SQLite is wiped on sleep.

services:
  - type: web
    name: discount-price-display
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && node ./scripts/db.mjs generate && npm run build
    startCommand: npm run start:production
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: SCOPES
        value: read_discounts,read_products,write_products
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
